# .repomind.yml — RepoMind configuration for this repo
# Docs: https://github.com/your-org/repomind

# MODE: What action should RepoMind take?
#   auto_fix  → opens a PR with the fix
#   dry_run   → comments on the failed run with the suggestion (no PR)
#   disabled  → ignore this repo
mode: auto_fix

# HITL (Human-In-The-Loop):
#   true  → PR opens as DRAFT, you review and merge manually
#   false → PR auto-merges after CI passes (full automation, demo only!)
hitl_required: true

policy:
  # Which failure types is RepoMind allowed to auto-fix?
  allowed_failure_types:
    - dependency_error
    - import_error
    - syntax_error
    - test_failure          # ← ADDED for demo
    - lint_error
    - type_error

  # Maximum risk level RepoMind can act on
  #   low    → only safe, mechanical fixes
  #   medium → moderate refactors allowed
  #   high   → big changes allowed (use carefully)
  max_risk_level: medium

  # Minimum LLM confidence required before acting (0.0 - 1.0)
  min_confidence: 0.7

# Optional notifications
notifications:
  slack_webhook: ""
  email: ""
